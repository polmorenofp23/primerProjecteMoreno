<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Discounts</title>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center w-100 px-5 mb-4 gap-4">
        <div class="discounts-filter input-group filter-inputs gap-3 w-75">
            <div class="input-group filter-inputs w-auto gap-3">
                <select id="filterUserType" class="form-select font-sting-light fs-14 w-auto">
                    <option value="">All User Types</option>
                </select>
                <select id="filterStatus" class="form-select font-sting-light fs-14 w-auto">
                    <option value="">All Statuses</option>
                    <option value="active" class="text-uppercase fs-16">Active</option>
                    <option value="inactive" class="text-uppercase fs-16">Inactive</option>
                </select>
                <div class="d-flex gap-3 ms-4">
                    <button type="button" class="btn btn-white p-2" id="refreshDiscountsBtn">
                        <i data-lucide="refresh-cw"></i> Refresh
                    </button>
                    <button type="button" class="btn btn-white p-2" id="clearDiscountsFiltersBtn">
                        <i data-lucide="eraser"></i> Clear
                    </button>
                    
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-red text-uppercase text-nowrap p-3 px-4 gap-4" id="newDiscountBtn">
            CREATE NEW DISCOUNT <i data-lucide="plus"></i>
        </button>
    </div>
    <div class="col-10 discounts-container p-3">
        <table id="discounts-table" class="table w-100 font-sting-light fs-14 text-primary-black">
            <thead>
                <tr>
                    <th class="text-start align-middle">Discount ID</th>
                    <th class="text-start align-middle">Name</th>
                    <th class="text-center align-middle">Description</th>
                    <th class="text-center align-middle">Percentage</th>
                    <th class="text-center align-middle">Status</th>
                    <th class="text-center align-middle">User Type</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="discounts-table-body" class="align-items-center">
                <!-- Data will be loaded via js there -->
            </tbody>
        </table>
    </div>

    <script src="/admin/js/objClasses.js" type="module"></script>
    <script src="/admin/js/discounts.js" type="module"></script>
</body>
</html>
