<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Products</title>
</head>
<body>
    <div class="d-flex justify-content-end align-items-center w-100 px-5 mb-4">
        <button type="button" class="btn-red p-3 px-4 gap-4" data-bs-toggle="modal" data-bs-target="#createProductModal">
            CREATE NEW PRODUCT <i data-lucide="plus"></i>
        </button>
    </div>
    <div class="col-10 products-container p-3">
        <table id="products-table" class="table w-100 font-sting-light fs-14 text-primary-black text-capitalize">
            <thead>
                <tr>
                    <th class="text-start align-middle">Name</th>
                    <th class="text-center align-middle">Product ID</th>
                    <th class="align-middle">Dish Type</th>
                    <th class="text-center align-middle">Status</th>
                    <th class="text-end align-middle">Price</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="products-table-body" class="align-items-center">
                <!-- Data will be loaded via JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Modal CREATE PRODUCT -->
    <div class="modal fade" id="createProductModal" tabindex="-1" aria-labelledby="createProductModalLabel" aria-hidden="flase">  <!--aria-hidden="true"-->
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <form id="createProductForm" class="needs-validation" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title" id="createProductModalLabel">Create Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-primary-black">
                        <div class="container-fluid px-5 py-3">
                            <div class="row font-sting-regular fs-20 align-items-center mb-4 ">
                                <div class="product-name col-md-9 px-3">
                                    <div class="input-group">
                                        <input type="text" class="form-control fs-20" id="productName" placeholder="Product name" required>
                                    </div>
                                </div>
                                <div class="product-price row align-items-center col-md-2 px-3">
                                    <div class="input-group w-75">
                                        <input type="number" class="form-control fs-20" id="productPrice" step="0.01" min="0" placeholder="0.00">
                                    </div>
                                    <span class="w-25">€</span>
                                </div>
                                <div class="product-id col-md-1 d-flex justify-content-end px-3">
                                    <span class="font-sting-regular fs-20">Id: <span id="productIdLabel">—</span></span>
                                </div>
                            </div>
                            <div class="row font-sting-light fs-14 align-items-start">
                                <div class="col-md-3 text-center">
                                    <div class="">
                                        <!--<img id="productPreview" src="/assets/img-placeholder.png" alt="Preview" class="img-fluid rounded mb-2" style="max-height:200px;">-->
                                        <div>
                                            <input class="form-control form-control-sm" type="file" id="productImage" accept="image/*" dissabled>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6 d-flex flex-column justify-content-start align-items-center">
                                    <div class="ingredients-list d-flex flex-column justify-content-start align-items-center w-100 mb-3">
                                        <label for="productIngredients" class="form-label font-sting-regular m-0">Ingredients</label>
                                        <div id="productIngredients" class="d-flex flex-wrap gap-2 border-1 rounded-0 border-secondary-white p-2" style="min-height: 100px; max-height: 150px; overflow-y: auto;">
                                            <!-- Ingredients tags will be added here -->
                                        </div>
                                        <div class="input-group mt-2">
                                            <input type="text" id="ingredientInput" class="form-control" placeholder="Add ingredient">
                                            <button type="button" id="addIngredientBtn" class="btn btn-secondary">Add</button>
                                        </div>

                                    </div>
                                    <textarea id="productDescription" class="form-control" rows="3" placeholder="Description..."></textarea>
                                </div>
                                
                                <div class="col-md-3 d-flex flex-column justify-content-between align-items-center">
                                    <div class="row d-flex justify-content-between align-items-center">
                                        <label for="productDishType" class="form-label font-sting-regular m-0">Dish Type</label>
                                        <select id="productDishType" class="form-select font-sting-light fs-14" required>
                                            <option value="" disabled selected>Select type</option>
                                            <option value="appetiser">Appetiser</option>
                                            <option value="main">Main Plate</option>
                                            <option value="dessert">Dessert</option>
                                            <option value="drink">Drink</option>
                                        </select>
                                    </div>
                                    <div class="form-check border-1 rounded-0 border-secondary-white py-2 w-100">
                                        <input class="form-check-input rounded-0 p-2 me-5" type="checkbox" id="productAvailable">
                                        <label class="form-check-label" for="productAvailable">Available</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer py-3 align-items-center justify-content-center">
                        <button type="submit" class="btn-red w-25 py-3 text-uppercase" id="createProductBtn">CREATE PRODUCT</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script src="/admin/js/products.js" type="module"></script>
</body>
</html>
