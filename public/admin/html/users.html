<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - users</title>
</head>
<body>
    <div class="users-filter d-flex justify-content-between align-items-center w-100 px-5 mb-4">
        <div class="input-group filter-inputs w-auto gap-3">
            <select id="filterUserType" class="form-select font-sting-light fs-14 w-auto">
                <option value="">All User Types</option>
            </select>
            <select id="filterRole" class="form-select font-sting-light fs-14 w-auto">
                <option value="">All Roles</option>
                <option value="client" class="text-uppercase fs-16">Client</option>
                <option value="admin" class="text-uppercase fs-16">Admin</option>
            </select>
            <div class="d-flex gap-3 ms-4">
                <button type="button" class="btn btn-white p-2" id="refreshUsersBtn">
                    <i data-lucide="refresh-cw"></i> Refresh
                </button>
                <button type="button" class="btn btn-white p-2" id="clearUsersFiltersBtn">
                    <i data-lucide="eraser"></i> Clear
                </button>
            </div>
        </div>
        <div class="d-flex gap-3">
            <button type="button" class="btn btn-white text-uppercase text-nowrap p-3 px-4" data-bs-toggle="modal" data-bs-target="#userTypeModal">
                CREATE NEW USER TYPE <i data-lucide="plus"></i>
            </button>
        </div>
    </div>
    <div class="col-10 users-container p-3">
        <table id="users-table" class="table w-100 font-sting-light fs-14 text-primary-black">
            <thead>
                <tr>
                    <th class="text-start align-middle">User ID</th>
                    <th class="text-center align-middle">Username</th>                    
                    <th class="text-center align-middle">Name</th>
                    <th class="text-center align-middle">Email</th>                    
                    <th class="text-center align-middle">Phone</th>
                    <th class="text-center align-middle">Role</th>
                    <th class="text-center align-middle">User Type</th>
                    <th class="text-center align-middle">Registered At</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="users-table-body" class="align-items-center">
                <!-- Data will be loaded via js there -->
            </tbody>
        </table>
    </div>

    <!-- Modal CREATE USER TYPE -->
    <div class="modal fade" id="userTypeModal" tabindex="-1" aria-labelledby="userTypeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-sting-regular fs-28 text-primary-dark-red text-uppercase ms-4" id="userTypeModalLabel">Create New User Type</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-primary-black p-4">
                    <div class="mb-3">
                        <label for="utName" class="form-label font-sting-regular fs-16">Name</label>
                        <input type="text" class="form-control form-control-sm rounded-0" id="utName" placeholder="e.g., Premium User">
                    </div>
                    <div class="mb-3">
                        <label for="utDescription" class="form-label font-sting-regular fs-16">Description</label>
                        <textarea class="form-control form-control-sm rounded-0" id="utDescription" rows="3" placeholder="Description"></textarea>
                    </div>
                </div>
                <div class="modal-footer mt-1 align-items-center justify-content-center">
                    <button type="button" class="btn-red w-25 py-3 text-uppercase" id="createUserTypeBtn">CREATE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/js/objClasses.js" type="module"></script>
    <script src="/admin/js/users.js" type="module"></script>
</body>
</html>
